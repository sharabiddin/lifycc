name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Install sshpass
          sudo apt-get update && sudo apt-get install -y sshpass
          
          
          # Create deployment archive
          tar -czf deploy.tar.gz \
            index.html app.js logo.svg sitemap.xml \
            Dockerfile nginx-simple.conf \
            docker-compose.yml Caddyfile
          
          # Copy to server
          sshpass -e scp -o StrictHostKeyChecking=no \
            deploy.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/
          
          # Deploy on server
          sshpass -e ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            # Extract files
            mkdir -p ~/url-shortener
            cd ~/url-shortener
            tar -xzf ~/deploy.tar.gz
            rm ~/deploy.tar.gz
            
            # Update domain in Caddyfile if provided
            if [ ! -z "${{ secrets.DOMAIN_NAME }}" ]; then
              sed -i "s/lify.cc/${{ secrets.DOMAIN_NAME }}/g" Caddyfile
            fi
            
            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            
            # Install Docker Compose if needed
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi
            
            # Stop old containers
            docker compose down 2>/dev/null || true
            
            # Build and start
            docker compose build --no-cache
            docker compose up -d
            
            # Show status
            sleep 5
            docker compose ps
            docker compose logs --tail=20
          EOF