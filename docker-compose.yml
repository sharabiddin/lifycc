version: '3.8'

services:
  # Caddy (Reverse Proxy with SSL)
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - frontend
      - backend

  # Frontend (Nginx serving static files)
  frontend:
    build: .
    container_name: url-shortener-frontend
    restart: unless-stopped
    networks:
      - web

  # Backend API (Go application)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      BASEURL: "https://lify.cc"
      
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: ${POSTGRES_PASSWORD:-secretpassword}
      DB_NAME: shortener
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: ${REDIS_PASSWORD:-redispass}
      REDIS_DB: 0
      
      CACHE_ENABLED: "true"
      CACHE_HOT_TTL: "24h"
      CACHE_WARM_TTL: "6h"
      CACHE_COLD_TTL: "1h"
      CACHE_HOT_THRESHOLD: "1000"
      CACHE_WARM_THRESHOLD: "100"
      
      MAX_TTL: "24h"
      MIN_TTL: "5m"
    networks:
      - web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "redis-cli", "--auth", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Migrations
  migrate:
    image: migrate/migrate
    container_name: url-shortener-migrate
    networks:
      - web
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database postgres://postgres:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/shortener?sslmode=disable
      up

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data: